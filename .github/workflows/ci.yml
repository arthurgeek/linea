name: CI

on:
  # No `paths` filter: `merge-ready` is the required status, and a run that
  # never starts never reports it. The `changes` job decides instead which
  # lanes the change needs.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # Every lane, the sweep and `fuzz` included, once a week on the default
  # branch.
  schedule:
    - cron: '17 4 * * 1'

env:
  ZIG_LOCAL_CACHE_DIR: /var/tmp/linea-zig-cache
  LINEA_SCRATCH: /var/tmp/linea-conformance

# A push to a pull request cancels that pull request's earlier run, and a push
# to main cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which lanes this run needs, lane by lane; `.github/scripts/changes.sh`
  # decides and documents the rule. A lane inherits when a commit of this
  # history passed it against the same base and nothing the lane reads changed
  # since: Markdown no gate reads leaves every lane alone, and the guide, the
  # decision index and the semantics are read only by `check` and
  # `optimised-unit`. A lane passed at a commit when any attempt of its job
  # there succeeded. A pull request's base is the base-branch commit it was
  # merged into for the run, and a push's is the commit itself; each run
  # records its own as a `tested base` annotation, which a later run reads
  # back through the check-runs API. The search starts at the head and walks
  # back through the pull request's commits, or main's, so a lane that failed
  # at the newest commit is found green at an older one or not at all, and a
  # push that cancelled an earlier run looks past the cancelled commit.
  #
  # A lane with no green commit falls back on the diff against the pull
  # request's base: a change to Markdown alone, outside what a gate reads,
  # skips it, and anything else runs it. `fuzz-mir` runs only when the change
  # touches what it guards: lowering, ownership, checking and the type tables
  # (`src/sema`), the loader that runs them in order, or the program
  # generator; with a green commit it also reruns on any code change of such a
  # pull request, so every head of one is fuzzed. A push to main with no green
  # commit runs `check`, and a scheduled or manual run runs every lane. When
  # the check runs cannot be read, no lane has a green commit: each is decided
  # as above, so a pull request of documentation alone still skips its lanes
  # and a push still runs `check` alone.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      check: ${{ steps.lanes.outputs.check }}
      sanitize: ${{ steps.lanes.outputs.sanitize }}
      sanitize-exclude: ${{ steps.lanes.outputs.sanitize-exclude }}
      optimised-unit: ${{ steps.lanes.outputs.optimised-unit }}
      optimised-corpus: ${{ steps.lanes.outputs.optimised-corpus }}
      optimised-soundness: ${{ steps.lanes.outputs.optimised-soundness }}
      sweep: ${{ steps.lanes.outputs.sweep }}
      fuzz-mir: ${{ steps.lanes.outputs.fuzz-mir }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Which lanes the change needs
        id: lanes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/changes.sh ci

  check:
    # A draft pull request runs nothing. A ready pull request runs `check`
    # beside `sanitize`, the three optimised lanes and, when it applies,
    # `fuzz-mir`; a push to main runs `check` alone; a manual run and the
    # weekly schedule run it beside every other lane. It is skipped where
    # `changes` finds it inherited or not needed.
    needs: changes
    if: ${{ needs.changes.outputs.check == 'run' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # Measured on the four-vCPU runner in November 2026, with recorded
    # outcomes restored: the test step took 92 minutes on a pull request when
    # it still ran the unit tests named `slow:`, about 64 of them the Debug
    # unit tests and the rest the conformance runner's build and the corpus
    # walk, and 114 minutes on a push to main, which also runs the guide and
    # the library's and examples' own tests. Without the `slow:` tests the
    # Debug unit tests take about a quarter as long (12 minutes rather than 44
    # on a laptop), which is what a pull request now runs here.
    # The outcome cache is keyed on the emitted IR and a stamp of every tool,
    # so a change to the toolchain invocation re-records every case -- the
    # whole corpus builds and runs from nothing, which fits under this bound
    # and not under a bound sized to the warm run alone. It still fires on a
    # stall, because a job that hangs and a job that is merely slow look
    # identical until someone cancels one.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # An outcome is keyed on the emitted IR and on a stamp of every tool a
      # build runs -- and under Nix that stamp is portable: a store path is a
      # content hash and every timestamp is normalised to epoch 1, so the same
      # `flake.lock` gives byte-identical stamps on any machine. The recorded
      # answers therefore mean the same thing here as they did there, and a
      # changed program simply misses and rebuilds.
      #
      # A cold hosted suite takes most of an hour. Persisting its recorded
      # outcomes keeps later revisions from rebuilding every case from zero.
      # Save each run separately so a retry can extend a partial snapshot.
      # Prefer snapshots of this revision before trying other revisions.
      - name: Restore program outcomes
        id: outcomes_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/outcomes
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/examples/outcomes
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/properties/outcomes
          key: outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}-
            outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      # A runner that stops answering the server takes its job log with it, so
      # the memory, disk and largest processes are sampled every 20 seconds
      # into a file this job uploads, and each sample is echoed by the long
      # step below.
      - name: Record runner resources
        run: .github/scripts/resource-log.sh start

      # The conformance suite's recorded outcomes live outside Zig's build
      # cache: their own key covers the emitted IR, runtime, commands and Nix
      # tool stamps, and the cache above persists them explicitly.
      - name: Formatting
        run: nix develop --command zig fmt --check build.zig build src runtime

      - name: Build
        run: nix develop --command zig build

      # A few seconds, and part of `test` below too; run first so a grammar
      # that stopped parsing a file fails before the hour the suite takes.
      - name: Editor grammar
        run: nix develop --command zig build editor

      # Each heavy step of the suite holds three to four and a half gigabytes:
      # a compile of the compiler, of the conformance runner or of the unit
      # tests, the unit tests running, and the corpus walk with the compilers
      # it starts. `-Dsequential` makes each wait for the one before it, and
      # `-j4` runs the light steps beside them on the runner's four vCPUs.
      # Measured cold on the 16 GB runner, on a smaller suite than today's,
      # this way took 40 minutes, against 56 with the heavy steps also in
      # parallel and 68 with `-j1`. The build runs at a lower priority so the
      # runner's own agent keeps getting scheduled while every core is busy.
      # The conformance runner is built ReleaseSafe (`-Dsafe-runner`): it
      # compiles and rewrites the generated programs in process, which takes
      # about 4.7 minutes in a Debug runner and 42 seconds in a ReleaseSafe
      # one. The compiler under test and the unit tests stay Debug.
      #
      # On a pull request the guide, the library's own tests and the examples'
      # own tests are left to `optimised-unit`, which runs beside this one; a
      # push to main runs them here. So are the unit tests named `slow:`
      # (`-Dslow-tests=false`), each ten seconds or more in a Debug binary and
      # together most of its run: `optimised-unit` runs every unit test, those
      # included, under ReleaseSafe.
      - name: Unit tests and conformance suite
        run: |
          .github/scripts/resource-log.sh follow & follower=$!
          trap 'kill "$follower" 2>/dev/null || true' EXIT
          nice -n 10 nix develop --command zig build test -j4 -Dsequential -Dsafe-runner -Dguide=${{ github.event_name == 'push' }} -Dslow-tests=${{ github.event_name == 'push' }} -Dscratch="$LINEA_SCRATCH-$GITHUB_JOB"

      # The library's own tests, asserted by their exit status rather than by a
      # transcript. The suite already runs this command as a case, and that case
      # compares what it printed against a golden -- which `-Dupdate` rewrites.
      # So a run that stopped passing can be accepted, and the case then holds
      # the failure as its expectation and goes green forever.
      #
      # Nothing here can be accepted. The command either exits zero or the build
      # is red, which is the one claim about the library a golden cannot make on
      # its own behalf.
      - name: The library's own tests pass
        if: ${{ github.event_name == 'push' }}
        run: nix develop --command zig build run -- test std

      # The examples', for the same reason and against the same hole: the suite
      # runs one of these as a case and compares its transcript, so a run that
      # stopped passing can be accepted into the golden.
      #
      # Every root beneath examples/, rather than a list of them, because a list
      # is a second place to remember: an example gaining a test and not gaining
      # a line here is one nothing runs, and nothing would say so. A root is each
      # examples/*.lin, each examples/*/ and each deeper directory holding a
      # linea.json, since `linea test` on an application runs the application's
      # tests alone and a library nested under it needs a run of its own.
      #
      # `zig build example-tests` runs `linea test` on each root and counts the
      # tests the runs report. It fails when any root fails, when a run ends
      # without a count, when the runs report no test at all, when a `.lin` file
      # lies outside every root's reach, and when examples/ holds a symlink.
      - name: The examples' own tests pass
        if: ${{ github.event_name == 'push' }}
        run: nix develop --command zig build example-tests -Dwalkers=1

      # A failed assertion or golden comparison still leaves completed program
      # outcomes. The runner checks their content and toolchain keys on reuse.
      # A checked-library entry is one set of library modules, 19 to 45 MB
      # (about 21 MB on average). The corpus imports some fifty-five sets,
      # and reading an entry touches its time, so the sixty-four most
      # recently used are kept: about 1.4 GB per lane. Each is keyed by the
      # compiler's own image, so a changed compiler or library misses and
      # writes anew; the step looks at entries only, never their locks or
      # temporary files.
      - name: Keep the newest checked libraries
        if: ${{ !cancelled() && steps.outcomes_restore.outcome == 'success' && steps.outcomes_restore.outputs.cache-hit != 'true' }}
        run: |
          dir="${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache"
          if [ -d "$dir" ]; then ls -t "$dir" | grep -E '^checked-std-[0-9a-f]{64}$' | tail -n +65 | sed "s|^|$dir/|" | xargs -r rm -f; fi
      - name: Save program outcomes
        if: ${{ !cancelled() && steps.outcomes_restore.outcome == 'success' && steps.outcomes_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/outcomes
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/examples/outcomes
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/properties/outcomes
          key: ${{ steps.outcomes_restore.outputs.cache-primary-key }}

      - name: Keep the resource log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-log-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resource.log
          if-no-files-found: ignore
          retention-days: 7

  # The runtime library a test run links, watched while it executes. The
  # address sanitizer instruments what `cc` compiles from C, which is
  # `runtime/linea_rt.c`; generated programs reach `cc` as printed LLVM IR
  # without the attribute it instruments, so their own loads and stores are
  # not watched. What this lane watches is the runtime, every allocation and
  # free through the intercepted allocator, and a leak check at every clean
  # exit -- the only check at run time that ownership abandoned no value.
  # The thread sanitizer instruments the same C, which holds every
  # synchronisation between a program's tasks, and reports a race there.
  #
  # So it runs what runs: the cases that record an exit status, the examples
  # and the transcripts that build or run a program, and no generated
  # programs. Everything else the corpus checks is the compiler's answer,
  # which the unsanitized lanes already compare.
  #
  # This runs here and not in the local loop because sanitized programs do
  # not work on Darwin, which is where the compiler is developed: the runtime
  # hangs before reaching `main`, on a C program that does nothing but return
  # a constant.
  sanitize:
    # A ready pull request runs this lane, and so do manual runs and the
    # weekly schedule. A push to main skips it, and so does a run where
    # `changes` finds it inherited or not needed.
    needs: changes
    if: ${{ needs.changes.outputs.sanitize == 'run' && github.event_name != 'push' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Every sanitizer `Sanitize` in `build.zig` offers, each in a run of
        # its own since the two cannot share a process; its doc records why
        # `memory` was retired. A gate in `build.zig` fails the build if this
        # list and the enum disagree, so no entry can be dropped by
        # forgetting.
        sanitizer: [address, thread]
        # A sanitizer whose run `changes` found inherited, or not needed.
        exclude: ${{ fromJSON(needs.changes.outputs.sanitize-exclude) }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # An outcome is keyed on the emitted IR and on a stamp of every tool a
      # build runs -- and under Nix that stamp is portable: a store path is a
      # content hash and every timestamp is normalised to epoch 1, so the same
      # `flake.lock` gives byte-identical stamps on any machine. The recorded
      # answers therefore mean the same thing here as they did there, and a
      # changed program simply misses and rebuilds.
      #
      # A cold hosted suite approaches an hour. Each sanitizer has its own
      # stamp and therefore its own cache: sharing this key made both lanes miss
      # together and race to save one incomplete answer.
      - name: Restore program outcomes
        id: outcomes_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}-${{ matrix.sanitizer }}/outcomes
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}-${{ matrix.sanitizer }}/linea-cache
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}-${{ matrix.sanitizer }}/examples/outcomes
          key: outcomes-${{ github.job }}-${{ matrix.sanitizer }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            outcomes-${{ github.job }}-${{ matrix.sanitizer }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}-
            outcomes-${{ github.job }}-${{ matrix.sanitizer }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      # Catch stack-switch and native lifetime failures before the longer
      # instrumented corpus walk.
      - name: Runtime C tests under ${{ matrix.sanitizer }}
        # The runtime's own C tests, built by `cc` with the sanitizer's
        # runtime linked, so the C the corpus reaches only through programs is
        # also driven directly: the task tests' threads, sessions and
        # concurrent allocation included.
        run: nix develop --command zig build test-native-math test-native-io test-native-net test-native-clock test-native-runtime test-native-task -Dsanitize=${{ matrix.sanitizer }}

      # The conformance suite's recorded outcomes live outside Zig's build
      # cache: their own key covers the emitted IR, runtime, commands and Nix
      # tool stamps, and the lane-specific cache above persists them explicitly.
      - name: Conformance suite under ${{ matrix.sanitizer }}
        # The compiler itself runs optimised with safety checks: the Debug
        # compiler's coverage belongs to `check`, and this lane's subject is the
        # runtime and the generated code under the sanitizer.
        run: nix develop --command zig build conformance --release=safe -Dscratch="$LINEA_SCRATCH-$GITHUB_JOB-${{ matrix.sanitizer }}" -Dsanitize=${{ matrix.sanitizer }}

      # A checked-library entry is one set of library modules, 19 to 45 MB
      # (about 21 MB on average). The corpus imports some fifty-five sets,
      # and reading an entry touches its time, so the sixty-four most
      # recently used are kept: about 1.4 GB per lane. Each is keyed by the
      # compiler's own image, so a changed compiler or library misses and
      # writes anew; the step looks at entries only, never their locks or
      # temporary files.
      - name: Keep the newest checked libraries
        if: ${{ !cancelled() && steps.outcomes_restore.outcome == 'success' && steps.outcomes_restore.outputs.cache-hit != 'true' }}
        run: |
          dir="${{ env.LINEA_SCRATCH }}-${{ github.job }}-${{ matrix.sanitizer }}/linea-cache"
          if [ -d "$dir" ]; then ls -t "$dir" | grep -E '^checked-std-[0-9a-f]{64}$' | tail -n +65 | sed "s|^|$dir/|" | xargs -r rm -f; fi

      - name: Save program outcomes
        if: ${{ !cancelled() && steps.outcomes_restore.outcome == 'success' && steps.outcomes_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}-${{ matrix.sanitizer }}/outcomes
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}-${{ matrix.sanitizer }}/linea-cache
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}-${{ matrix.sanitizer }}/examples/outcomes
          key: ${{ steps.outcomes_restore.outputs.cache-primary-key }}

  # The optimised lanes: the unit tests built ReleaseSafe, and on a weekly or
  # manual run built ReleaseFast as well; the corpus against a ReleaseFast
  # compiler; and the soundness property against the same. `check` covers the
  # corpus and the compiler's unit tests in Debug; these are the optimised
  # build of both, and on a pull request `optimised-unit` is the only lane
  # that runs the unit tests named `slow:`, which `check` skips there. Linea
  # results must remain defined and independent of compiler optimization.
  #
  # Three jobs on three runners, so they run side by side: one after another
  # on one runner they took 72 minutes, the corpus walk alone 35 of them. Each
  # builds only what its steps run, and `changes` decides each on its own, so
  # one that failed reruns while the others keep their pass.
  #
  # A ready pull request runs them, and so do manual runs and the weekly
  # schedule. A push to main skips them, and so does a run where `changes`
  # finds one inherited or not needed.

  # The unit tests, and what `check` leaves to this lane outside a push to
  # main: the guide's programs, the library's own tests and the examples' own
  # tests. Everything that reads the Markdown a gate reads runs here -- the
  # documentation gates and the tests that read the semantics are part of
  # `test-unit`, and the guide compiles the chapters -- so an edit to the
  # guide, the decision index or the semantics reruns this job and `check`,
  # and the other two keep their pass.
  optimised-unit:
    name: optimised (unit)
    needs: changes
    if: ${{ needs.changes.outputs.optimised-unit == 'run' && github.event_name != 'push' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # On the four-vCPU runner in November 2026 the ReleaseSafe unit tests took
    # 17 minutes, their compile included, and the guide, the library's tests
    # and the examples' tests 8.5 more, the Debug compiler's compile included:
    # about 27 minutes on a pull request, and about 45 on a weekly or manual
    # run, whose ReleaseFast unit tests took 18.5. Only the guide reads a
    # cache, the checked-library entries, so a cold run takes about as long
    # as a warm one; the bound is there for a stall.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # The guide reads the checked-library entries its programs import,
      # under a key of this job's own, so no two jobs race to save one key.
      # Nothing here records program outcomes.
      - name: Restore program outcomes
        id: outcomes_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache
          key: outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}-
            outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      # A runner that stops answering the server takes its job log with it, so
      # the memory, disk and largest processes are sampled every 20 seconds
      # into a file this job uploads, and each sample is echoed by the long
      # steps below.
      - name: Record runner resources
        run: .github/scripts/resource-log.sh start

      # One suite per step, and each with `-Dsequential`, for the reasons
      # given on the `check` job's test step: a suite's heavy steps wait for
      # one another, and two suites in one build would run side by side.
      #
      # The unit tests are built ReleaseSafe rather than ReleaseFast. On a pull
      # request this is the only run of the tests named `slow:`, and ReleaseSafe
      # keeps what a Debug build checks: bounds, overflow and `unreachable`,
      # every `std.debug.assert`, the compiler's cross-checks that run only
      # under `std.debug.runtime_safety`, and the testing allocator's report of
      # a double free, a use after free or a leak. On a laptop the whole step
      # takes 13.5 minutes this way against 9 ReleaseFast, the compile 4
      # minutes in both; this step took 18.5 minutes ReleaseFast on the runner.
      - name: Unit tests, optimised
        run: |
          .github/scripts/resource-log.sh follow & follower=$!
          trap 'kill "$follower" 2>/dev/null || true' EXIT
          nice -n 10 nix develop --command zig build test-unit --release=safe -j4 -Dsequential -Dscratch="$LINEA_SCRATCH-$GITHUB_JOB"

      # The unit tests again against compiler code built ReleaseFast, as
      # `-Drelease` builds it for users, where a defect that safety checks
      # would trap instead runs on. Weekly and on a manual run only: a pull
      # request runs the ReleaseSafe build above, and `optimised-corpus` runs
      # the corpus against a ReleaseFast compiler.
      - name: Unit tests, ReleaseFast
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          .github/scripts/resource-log.sh follow & follower=$!
          trap 'kill "$follower" 2>/dev/null || true' EXIT
          nice -n 10 nix develop --command zig build test-unit --release=fast -j4 -Dsequential -Dscratch="$LINEA_SCRATCH-$GITHUB_JOB"

      # These run with the Debug compiler, as they do in `check` on main,
      # because a trap in an optimised compiler is a silent miscompile instead.
      # The three build one Debug compiler between them.
      - name: The guide's programs print what it shows
        run: nix develop --command zig build guide -Dscratch="$LINEA_SCRATCH-$GITHUB_JOB"

      # The library's own tests, asserted by their exit status rather than by a
      # transcript. The suite already runs this command as a case, and that case
      # compares what it printed against a golden -- which `-Dupdate` rewrites.
      # So a run that stopped passing can be accepted, and the case then holds
      # the failure as its expectation and goes green forever.
      #
      # Nothing here can be accepted. The command either exits zero or the build
      # is red, which is the one claim about the library a golden cannot make on
      # its own behalf.
      - name: The library's own tests pass
        run: nix develop --command zig build run -- test std

      # The examples', for the same reason and against the same hole: the suite
      # runs one of these as a case and compares its transcript, so a run that
      # stopped passing can be accepted into the golden.
      #
      # Every root beneath examples/, rather than a list of them, because a list
      # is a second place to remember: an example gaining a test and not gaining
      # a line here is one nothing runs, and nothing would say so. A root is each
      # examples/*.lin, each examples/*/ and each deeper directory holding a
      # linea.json, since `linea test` on an application runs the application's
      # tests alone and a library nested under it needs a run of its own.
      #
      # `zig build example-tests` runs `linea test` on each root and counts the
      # tests the runs report. It fails when any root fails, when a run ends
      # without a count, when the runs report no test at all, when a `.lin` file
      # lies outside every root's reach, and when examples/ holds a symlink.
      - name: The examples' own tests pass
        run: nix develop --command zig build example-tests -Dwalkers=2

      # The checked-library entries the guide read, kept as the corpus job
      # keeps its own.
      - name: Keep the newest checked libraries
        if: ${{ !cancelled() && steps.outcomes_restore.outcome == 'success' && steps.outcomes_restore.outputs.cache-hit != 'true' }}
        run: |
          dir="${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache"
          if [ -d "$dir" ]; then ls -t "$dir" | grep -E '^checked-std-[0-9a-f]{64}$' | tail -n +65 | sed "s|^|$dir/|" | xargs -r rm -f; fi
      - name: Save program outcomes
        if: ${{ !cancelled() && steps.outcomes_restore.outcome == 'success' && steps.outcomes_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache
          key: ${{ steps.outcomes_restore.outputs.cache-primary-key }}

      - name: Keep the resource log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-log-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resource.log
          if-no-files-found: ignore
          retention-days: 7

  # The corpus and the examples' transcripts against a ReleaseFast compiler,
  # with the conformance runner built ReleaseFast to drive it.
  optimised-corpus:
    name: optimised (corpus)
    needs: changes
    if: ${{ needs.changes.outputs.optimised-corpus == 'run' && github.event_name != 'push' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # On the four-vCPU runner in November 2026 the step took 35 minutes, the
    # compiles of the compiler and the runner included. The outcome cache is
    # keyed on the emitted IR and a stamp of every tool, so a change to the
    # toolchain invocation re-records every case and the whole corpus builds
    # and runs from nothing; the bound fits that run and still fires on a
    # stall.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # Its own key, because the IR an optimised compiler emits is the IR a
      # debug one emits and the outcomes are therefore shared -- but the tool
      # stamp differs, so a miss here must not evict what `check` recorded.
      # This job alone writes the key, so no two jobs race to save it.
      - name: Restore program outcomes
        id: outcomes_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/outcomes
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/examples/outcomes
          key: outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}-
            outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - name: Record runner resources
        run: .github/scripts/resource-log.sh start

      # `-Dsequential` for the reasons given on the `check` job's test step:
      # the compiles of the compiler and the runner, and the walk with the
      # compilers it starts, each hold several gigabytes and wait for one
      # another.
      - name: Conformance suite, optimised
        run: |
          .github/scripts/resource-log.sh follow & follower=$!
          trap 'kill "$follower" 2>/dev/null || true' EXIT
          nice -n 10 nix develop --command zig build conformance --release=fast -j4 -Dsequential -Dscratch="$LINEA_SCRATCH-$GITHUB_JOB"

      # A checked-library entry is one set of library modules, 19 to 45 MB
      # (about 21 MB on average). The corpus imports some fifty-five sets,
      # and reading an entry touches its time, so the sixty-four most
      # recently used are kept: about 1.4 GB per lane. Each is keyed by the
      # compiler's own image, so a changed compiler or library misses and
      # writes anew; the step looks at entries only, never their locks or
      # temporary files.
      - name: Keep the newest checked libraries
        if: ${{ !cancelled() && steps.outcomes_restore.outcome == 'success' && steps.outcomes_restore.outputs.cache-hit != 'true' }}
        run: |
          dir="${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache"
          if [ -d "$dir" ]; then ls -t "$dir" | grep -E '^checked-std-[0-9a-f]{64}$' | tail -n +65 | sed "s|^|$dir/|" | xargs -r rm -f; fi
      - name: Save program outcomes
        if: ${{ !cancelled() && steps.outcomes_restore.outcome == 'success' && steps.outcomes_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/outcomes
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/examples/outcomes
          key: ${{ steps.outcomes_restore.outputs.cache-primary-key }}

      - name: Keep the resource log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-log-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resource.log
          if-no-files-found: ignore
          retention-days: 7

  # The language's memory promise held to generated programs: every operation
  # that can move, grow or free storage meets every live observation of it,
  # and an accepted unsound program fails. It is a build step of its own, so
  # no suite runs it; a change to the ownership checker, the MIR verifier or
  # the storage model can otherwise merge without it having run.
  optimised-soundness:
    name: optimised (soundness)
    needs: changes
    if: ${{ needs.changes.outputs.optimised-soundness == 'run' && github.event_name != 'push' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # On the four-vCPU runner in November 2026 the two steps took 11 minutes
    # with the runner already built, and building the ReleaseFast runner took
    # 8 more: about 20 minutes. A cold run checks every matrix program and
    # generated program from nothing; the bound fits it and still fires on a
    # stall.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # The soundness run records its outcomes beside the corpus's, under a
      # key of this job's own, so no two jobs race to save one key.
      - name: Restore program outcomes
        id: outcomes_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/soundness/outcomes
          key: outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}-
            outcomes-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - name: Record runner resources
        run: .github/scripts/resource-log.sh start

      # The soundness run is one heavy step, so `-j1`.
      - name: Soundness matrix and generated storage programs
        run: |
          .github/scripts/resource-log.sh follow & follower=$!
          trap 'kill "$follower" 2>/dev/null || true' EXIT
          nice -n 10 nix develop --command zig build soundness --release=fast -j1 -Dscratch="$LINEA_SCRATCH-$GITHUB_JOB"

      # Sixteen more generated storage programs. On the weekly schedule and a
      # manual run the seeds move with the run number, so each searches a
      # window no earlier run has, and a finding fails that run, not a pull
      # request it has nothing to do with. A pull request checks a fixed
      # second window, so a re-run answers the same and its outcomes stay
      # cached. The matrix does not depend on the seed and is left out. This
      # is what stands in for fuzzing the storage property, which a search on
      # every pull request did at a hundred inputs for ten minutes.
      - name: Generated storage programs over further seeds
        env:
          ROTATE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          .github/scripts/resource-log.sh follow & follower=$!
          trap 'kill "$follower" 2>/dev/null || true' EXIT
          if [ "$ROTATE" = true ]; then seed=$(( GITHUB_RUN_NUMBER * 16 )); else seed=16; fi
          echo "storage program seeds $seed..$(( seed + 15 ))"
          nice -n 10 nix develop --command zig build soundness --release=fast -j1 -Dsoundness-matrix=false -Dseed=$seed -Dscratch="$LINEA_SCRATCH-$GITHUB_JOB"

      # The checked-library entries the generated programs read, kept as the
      # corpus job keeps its own.
      - name: Keep the newest checked libraries
        if: ${{ !cancelled() && steps.outcomes_restore.outcome == 'success' && steps.outcomes_restore.outputs.cache-hit != 'true' }}
        run: |
          dir="${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache"
          if [ -d "$dir" ]; then ls -t "$dir" | grep -E '^checked-std-[0-9a-f]{64}$' | tail -n +65 | sed "s|^|$dir/|" | xargs -r rm -f; fi
      - name: Save program outcomes
        if: ${{ !cancelled() && steps.outcomes_restore.outcome == 'success' && steps.outcomes_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/linea-cache
            ${{ env.LINEA_SCRATCH }}-${{ github.job }}/soundness/outcomes
          key: ${{ steps.outcomes_restore.outputs.cache-primary-key }}

      - name: Keep the resource log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-log-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resource.log
          if-no-files-found: ignore
          retention-days: 7

  # What each input dimension costs, and how that cost grows.
  #
  # A job of its own because it is the one gate that reads a clock. The suite
  # asserts what a compilation asked for, which is counted and reads the same
  # on every machine; a walk inside a walk allocates nothing and runs straight
  # past it. That shape is a real defect class, so something has
  # to time it -- and a timing gate inside the suite would fail on a busy
  # machine and teach everyone to re-run the suite.
  #
  # It asserts a ratio across a doubling rather than a duration: about two is
  # linear, about four is quadratic, and a slow runner divides out of both
  # sides. Nothing else runs in this job, and a failure names a dimension.
  sweep:
    # A ready pull request, manual runs and the weekly schedule run it beside
    # the other lanes. No other lane waits for it and `merge-ready` does not
    # read it: it times passes against a clock, and a slow shared runner can
    # fail it without a regression. A failure stays visible on the run.
    needs: changes
    if: ${{ needs.changes.outputs.sweep == 'run' && github.event_name != 'push' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # Release, because the sizes the sweep uses were chosen against one: a
      # debug build takes long enough per shape to make the job slow without
      # making the ratio any truer.
      #
      # No outcome cache here on purpose. A pass that gets slower emits the
      # same bytes, so a cached answer is exactly what a regression produces.
      - name: Build the release sweep runner
        shell: bash
        run: nix develop --command zig build conformance-runner -Drelease 2>&1 | tee "$RUNNER_TEMP/sweep-build.log"

      - name: What each input dimension costs
        continue-on-error: true
        shell: bash
        run: |
          read_optional() {
            for path in "$@"; do
              echo ">>> $path"
              cat "$path" 2>/dev/null || echo "unavailable: $path"
            done
          }
          snapshot() {
            echo ">>> $1: $(date -u +%FT%TZ)"
            if ! grep -E '^(Cpus_allowed|Mems_allowed)' /proc/self/status; then
              echo 'unavailable: process CPU/memory affinity'
            fi
            read_optional /proc/stat /proc/loadavg /proc/self/cgroup /proc/meminfo /proc/pressure/memory
            cgroup_paths=(/sys/fs/cgroup)
            cgroup_path=$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup 2>/dev/null) || cgroup_path=
            if [[ -n "$cgroup_path" && "$cgroup_path" != / ]]; then
              cgroup_paths+=("/sys/fs/cgroup$cgroup_path")
            fi
            for path in "${cgroup_paths[@]}"; do
              read_optional "$path"/{cpu.max,cpu.stat,memory.current,memory.peak,memory.events,memory.swap.current}
            done
          }
          {
            lscpu || echo 'unavailable: lscpu CPU model and topology'
            lscpu --caches || echo 'unavailable: lscpu cache topology'
            snapshot before
            set +e
            nix develop --command /usr/bin/time -v ./zig-out/bin/conformance "$GITHUB_WORKSPACE/tests" --sweep
            sweep_status=$?
            set -e
            snapshot after
            echo ">>> sweep exit status: $sweep_status"
            exit "$sweep_status"
          } 2>&1 | tee "$RUNNER_TEMP/sweep.log"

      - name: Keep sweep output and runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sweep*.log
          if-no-files-found: warn
          retention-days: 30

  # The frontend's promises are total: any bytes lex to a stream that reproduces
  # them, any bytes parse to a tree, any span renders. A generator tests those
  # far better than written cases, which cover only programs someone thought of.
  fuzz:
    # Weekly and on a manual run, not per pull request: six of the eight
    # targets have never recorded a finding, and the one that guards what a
    # change to the middle of the compiler can break runs on a pull request
    # as `fuzz-mir` below. The inputs a search reaches are kept between runs, so
    # each week's search starts where the last one stopped.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    # A release build of the fuzz root and twenty thousand runs of each
    # target. A quiet run takes about half an hour.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the inputs earlier searches reached
        id: fuzz_restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/f
          key: fuzz-inputs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-inputs-${{ runner.os }}-

      # A crash an earlier search saved was reported, and kept as an artifact,
      # by the run that found it. Zig never removes the file, so a restored
      # one would fail every later run whether or not the defect was fixed.
      - name: Forget a crash an earlier search recorded
        run: rm -f "$ZIG_LOCAL_CACHE_DIR/f/crash"

      - name: Record runner resources
        run: .github/scripts/resource-log.sh start

      # Release, because Zig's non-LLVM backend cannot build a fuzz test on
      # 0.16 and a release build uses LLVM instead. This step selects the
      # fuzz entry points named `fuzz:` without running ordinary unit tests or
      # native corpus examples. It produces no conformance outcomes to cache.
      #
      # A run bound rather than a time bound makes the search end on its own.
      - name: Fuzz the frontend
        run: |
          .github/scripts/resource-log.sh follow & follower=$!
          trap 'kill "$follower" 2>/dev/null || true' EXIT
          nix develop --command zig build fuzz --release=safe --fuzz=20K -Dfuzz-filter=fuzz:

      # Zig's bounded fuzz runner can save a crash while returning success.
      # An empty input can reproduce a failure, so check presence, not size.
      - name: No fuzz crash was recorded
        run: test ! -e "$ZIG_LOCAL_CACHE_DIR/f/crash"

      # Only after a clean search, so a crash is never saved for the next one.
      - name: Keep the inputs this search reached
        if: ${{ success() && steps.fuzz_restore.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/f
          key: fuzz-inputs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      # A crash is only useful with the input that caused it. Without this the
      # runner is destroyed and the reproduction goes with it, leaving a red
      # job and nothing to act on.
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/f/
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep the resource log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-log-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resource.log
          if-no-files-found: ignore
          retention-days: 7

  # The one fuzz target that runs before a pull request merges: a module
  # lowered from a program the compiler accepted must verify. A ready pull
  # request runs it when its change touches what the target guards, as
  # `changes` reports in `fuzz-mir`. The weekly `fuzz` already runs this target
  # among the others, so scheduled and manual runs do not repeat it here.
  fuzz-mir:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.changes.outputs.fuzz-mir == 'run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Fuzz the verifier over lowered programs
        run: |
          nix develop --command zig build fuzz --release=safe --fuzz=20K "-Dfuzz-filter=fuzz: a module lowered"

      - name: No fuzz crash was recorded
        run: test ! -e "$ZIG_LOCAL_CACHE_DIR/f/crash"

      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-mir-failures
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/f/
          if-no-files-found: ignore
          retention-days: 30

  # Context ABI and parked-stack safety must execute on both Linux ABIs;
  # compiling the other architecture cannot exercise its saved registers.
  # This lane always runs, so an inherited x86 check cannot hide an ARM failure.
  fibers:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Contexts, parks, socket waits and fault recovery
        run: nix develop --command zig build test-native-task test-native-fiber-scale test-native-net test-native-clock -Drelease

      - name: Public execution APIs and foreign callbacks
        run: |
          nix develop --command zig build conformance -Drelease -- tests/fibers_public
          nix develop --command zig build conformance -Drelease -- tests/fibers_foreign
          nix develop --command zig build conformance -Drelease -- tests/io/simulation

  # Every run and attempt of a lane saves its cache under a key of its own,
  # and a cache stays until the repository's 10 GB are spent and the least
  # recently used go: main's, the only ones a new pull request can restore.
  # So once the lanes that save are done, this job deletes each lane's older
  # caches on the run's ref, keeping the one this run saved; a lane that did
  # not save in this attempt keeps what it has.
  #
  # A job of its own because the token that may delete caches must not reach
  # the code under test: the Nix installer writes the job's token into
  # `/etc/nix/nix.conf`, which every later step can read. This job installs
  # nothing, builds nothing, and checks out only the script and the lock file
  # whose hash the keys name. A pull request from a fork gets a token that
  # cannot delete, so it is skipped there. Nothing waits for it, and
  # `merge-ready` does not read it.
  prune-caches:
    needs: [check, sanitize, optimised-unit, optimised-corpus, optimised-soundness, fuzz]
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /flake.lock

      # Each key is the one its lane's restore step names for this run; the
      # sanitizers are the `sanitize` matrix's. One call lists the ref's
      # caches once for every lane.
      - name: Delete each lane's older caches on this ref
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK: ${{ hashFiles('flake.lock') }}
        run: |
          this_run="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          lanes=()
          for lane in check sanitize-address sanitize-thread optimised-unit optimised-corpus optimised-soundness; do
            lanes+=("outcomes-$lane-$RUNNER_OS-$LOCK-$GITHUB_SHA-$this_run" "$GITHUB_SHA-$this_run")
          done
          .github/scripts/prune-caches.sh "${lanes[@]}" "fuzz-inputs-$RUNNER_OS-$this_run" "$this_run"

  # The one status the ruleset on main requires, so it runs on every event and
  # always reports. It fails when any lane it reads failed or was cancelled,
  # and when a lane `changes` said to run did not pass:
  #
  # - on a pull request, `check`, `sanitize`, `optimised-unit`,
  #   `optimised-corpus`, `optimised-soundness` and `fuzz-mir`, each where
  #   `changes` said `run`; a draft runs nothing and is not ready;
  # - on a push to main, `check` where `changes` said `run`;
  # - on a manual or scheduled run, `check`, `sanitize` and the three
  #   optimised lanes, which `changes` always runs there, and `fuzz`.
  #
  # A lane `changes` found inherited or not needed counts as passed only when
  # it was skipped. `sweep` reads a clock, so it reports on its own and is not
  # read here.
  merge-ready:
    needs: [changes, check, sanitize, optimised-unit, optimised-corpus, optimised-soundness, fuzz, fuzz-mir, fibers]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every lane the event requires passed
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          CHANGES: ${{ needs.changes.result }}
          WANT_CHECK: ${{ needs.changes.outputs.check }}
          WANT_SANITIZE: ${{ needs.changes.outputs.sanitize }}
          WANT_OPTIMISED_UNIT: ${{ needs.changes.outputs.optimised-unit }}
          WANT_OPTIMISED_CORPUS: ${{ needs.changes.outputs.optimised-corpus }}
          WANT_OPTIMISED_SOUNDNESS: ${{ needs.changes.outputs.optimised-soundness }}
          WANT_FUZZ_MIR: ${{ needs.changes.outputs.fuzz-mir }}
          CHECK: ${{ needs.check.result }}
          SANITIZE: ${{ needs.sanitize.result }}
          OPTIMISED_UNIT: ${{ needs.optimised-unit.result }}
          OPTIMISED_CORPUS: ${{ needs.optimised-corpus.result }}
          OPTIMISED_SOUNDNESS: ${{ needs.optimised-soundness.result }}
          FUZZ: ${{ needs.fuzz.result }}
          FUZZ_MIR: ${{ needs.fuzz-mir.result }}
          FIBERS: ${{ needs.fibers.result }}
        run: |
          echo "changes: $CHANGES (check=$WANT_CHECK, sanitize=$WANT_SANITIZE, optimised-unit=$WANT_OPTIMISED_UNIT, optimised-corpus=$WANT_OPTIMISED_CORPUS, optimised-soundness=$WANT_OPTIMISED_SOUNDNESS, fuzz-mir=$WANT_FUZZ_MIR)"
          echo "check: $CHECK, sanitize: $SANITIZE, optimised-unit: $OPTIMISED_UNIT, optimised-corpus: $OPTIMISED_CORPUS, optimised-soundness: $OPTIMISED_SOUNDNESS, fuzz: $FUZZ, fuzz-mir: $FUZZ_MIR"
          if [ "$CHANGES" != success ]; then
            echo "which lanes the change needs is unknown, so no lane can be judged"
            exit 1
          fi
          case " $CHECK $SANITIZE $OPTIMISED_UNIT $OPTIMISED_CORPUS $OPTIMISED_SOUNDNESS $FUZZ $FUZZ_MIR $FIBERS " in
            *" failure "*|*" cancelled "*)
              echo "a lane failed or was cancelled"
              exit 1 ;;
          esac
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ]; then
            echo "a draft pull request runs no lane"
            exit 1
          fi
          status=0
          judge() {
            local lane=$1 want=$2 result=$3
            case "$want" in
              run)
                if [ "$result" != success ]; then
                  echo "$lane had to run and was $result"
                  status=1
                fi ;;
              inherit|skip)
                if [ "$result" != skipped ]; then
                  echo "$lane was $want and still ran: $result"
                  status=1
                else
                  echo "$lane: $want"
                fi ;;
              *)
                echo "changes named no decision for $lane"
                status=1 ;;
            esac
          }
          judge fibers run "$FIBERS"
          judge check "$WANT_CHECK" "$CHECK"
          judge sanitize "$WANT_SANITIZE" "$SANITIZE"
          judge optimised-unit "$WANT_OPTIMISED_UNIT" "$OPTIMISED_UNIT"
          judge optimised-corpus "$WANT_OPTIMISED_CORPUS" "$OPTIMISED_CORPUS"
          judge optimised-soundness "$WANT_OPTIMISED_SOUNDNESS" "$OPTIMISED_SOUNDNESS"
          judge fuzz-mir "$WANT_FUZZ_MIR" "$FUZZ_MIR"
          case "$EVENT" in
            pull_request|push) ;;
            *) judge fuzz run "$FUZZ" ;;
          esac
          exit "$status"
