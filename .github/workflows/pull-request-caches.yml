name: Pull request caches

# A run of a pull request saves its caches under `refs/pull/N/merge`, which
# only that pull request's runs can restore. Once it closes nothing can read
# them, yet they stay until the repository's 10 GB are spent and the least
# recently used go, which are main's: the only caches a new pull request can
# restore. So closing a pull request deletes every cache under its ref.
#
# A workflow of its own, not a job in `ci.yml`: a `closed` trigger there would
# start the whole CI workflow, its `changes` job and `merge-ready` included,
# on every close, and share the concurrency group of the pull request's runs.
# Nothing here is a required status.
#
# `pull_request_target` runs this file as the base branch holds it, with a
# token that may delete a fork's caches too, so a pull request can neither
# edit the workflow that deletes its caches nor keep them by coming from a
# fork. That is safe because nothing of the pull request runs: there is no
# checkout, and the one input taken from the event is its number, which
# names the ref to delete.
on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  delete-caches:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      # `--all` lists every page of the ref's caches before deleting them, and
      # `--succeed-on-no-caches` makes a pull request that saved none pass.
      - name: Delete the caches only this pull request could restore
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: gh cache delete --all --ref "$REF" --succeed-on-no-caches
